<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Async Web Server</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="page">
        <h1>Async Web Server</h1>

        <p>
            Сервер реализован на Boost.Asio с использованием C++20 coroutines.
        </p>

        <section class="card">
            <h2>Доступные endpoints</h2>

            <ul>
                <li><code>GET /</code> главная страница</li>
                <li><code>GET /status</code> JSON-статус сервера</li>
                <li><code>POST /echo</code> возврат тела запроса</li>
                <li><code>GET /static/style.css</code> статический CSS-файл</li>
            </ul>
        </section>
    </main>
</body>
</html>
