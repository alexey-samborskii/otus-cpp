<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Веб-сервер планировщик задач</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
</head>

<body>
    <main class="page">
        <section class="panel">
            <div class="header">
                <div>
                    <h1>Веб-сервер планировщик задач</h1>
                </div>

                <button id="refresh-button" class="button button-secondary" type="button">
                    Получить список задач
                </button>
            </div>

            <div class="content">
                <section class="editor">
                    <h2 id="form-title">Создать задачу</h2>

                    <form id="task-form">
                        <input id="task-id" type="hidden">

                        <label for="task-title">Название задачи</label>
                        <input id="task-title" type="text" maxlength="200" placeholder="Например, подготовить отчёт"
                            required>

                        <label for="task-description">Описание</label>
                        <textarea id="task-description" rows="5" maxlength="5000"
                            placeholder="Описание задачи"></textarea>

                        <label for="task-scheduled-at">Дата и время выполнения</label>
                        <input id="task-scheduled-at" type="datetime-local" required>

                        <div class="actions">
                            <button id="submit-button" class="button button-primary" type="submit">
                                Создать задачу
                            </button>

                            <button id="cancel-edit-button" class="button button-secondary hidden" type="button">
                                Отменить изменение
                            </button>
                        </div>
                    </form>

                    <p id="form-message" class="message"></p>
                </section>

                <section class="tasks">
                    <div class="tasks-header">
                        <h2>Список задач</h2>
                        <span id="task-count" class="counter">0</span>
                    </div>

                    <div id="loading" class="empty-state">
                        Загрузка задач...
                    </div>

                    <div id="empty-state" class="empty-state hidden">
                        Задач пока нет.
                    </div>

                    <div id="tasks-list" class="tasks-list"></div>
                </section>
            </div>
        </section>
    </main>

    <template id="task-template">
        <article class="task-card">
            <div class="task-info">
                <p class="task-id"></p>
                <h3 class="task-title"></h3>
                <p class="task-description"></p>

                <dl class="task-meta">
                    <div>
                        <dt>Статус</dt>
                        <dd class="task-status"></dd>
                    </div>

                    <div>
                        <dt>Запланировано</dt>
                        <dd class="task-scheduled-at"></dd>
                    </div>
                </dl>
            </div>

            <div class="task-actions">
                <button class="button button-small edit-button" type="button">
                    Изменить
                </button>

                <button class="button button-small button-danger delete-button" type="button">
                    Удалить
                </button>
            </div>
        </article>
    </template>
</body>

</html>
