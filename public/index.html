<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Веб-сервер планировщик задач</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
</head>

<body>
    <main class="page">
        <section class="panel">
            <div class="header">
                <div>
                    <h1>Веб-сервер планировщик задач</h1>
                </div>

                <button id="refresh-button" class="button button-secondary" type="button">
                    Получить список задач
                </button>
            </div>

            <div class="content">
                <section class="editor">
                    <h2 id="form-title">Создать задачу</h2>

                    <form id="task-form" autocomplete="off">
                        <input id="task-id" type="hidden">

                        <label for="task-title">Название задачи</label>
                        <input
                            id="task-title"
                            name="task-title"
                            type="text"
                            maxlength="200"
                            placeholder="Например, подготовить отчёт"
                            autocomplete="off"
                            required
                        >

                        <label for="task-description">Описание</label>
                        <textarea
                            id="task-description"
                            name="task-description"
                            rows="5"
                            maxlength="5000"
                            placeholder="Описание задачи"
                            autocomplete="off"
                        ></textarea>

                        <label for="task-scheduled-at">Дата и время выполнения</label>
                        <input
                            id="task-scheduled-at"
                            name="task-scheduled-at"
                            type="datetime-local"
                            autocomplete="off"
                            required
                        >

                        <div class="actions">
                            <button id="submit-button" class="button button-primary" type="submit">
                                Создать задачу
                            </button>

                            <button id="cancel-edit-button" class="button button-secondary hidden" type="button">
                                Отменить изменение
                            </button>
                        </div>
                    </form>

                    <p id="form-message" class="message"></p>
                </section>

                <section class="tasks">
                    <div class="tasks-header">
                        <h2>Список задач</h2>
                        <span id="task-count" class="counter">0</span>
                    </div>

                    <div id="loading" class="empty-state">
                        Загрузка задач...
                    </div>

                    <div id="empty-state" class="empty-state hidden">
                        Задач пока нет.
                    </div>

                    <div id="tasks-list" class="tasks-list"></div>
                </section>
            </div>
        </section>
    </main>

    <template id="task-template">
        <article class="task-card">
            <div class="task-info">
                <div class="task-field">
                    <div class="task-field-label">ID задачи:</div>
                    <div class="task-field-value task-id"></div>
                </div>

                <div class="task-field">
                    <div class="task-field-label">Название задачи:</div>
                    <div class="task-field-value task-title"></div>
                </div>

                <div class="task-field">
                    <div class="task-field-label">Описание:</div>
                    <div class="task-field-value task-description"></div>
                </div>

                <div class="task-field">
                    <div class="task-field-label">Запланировано:</div>
                    <div class="task-field-value task-scheduled-at"></div>
                </div>

                <div class="task-field">
                    <div class="task-field-label">Статус:</div>
                    <div class="task-field-value task-status"></div>
                </div>
            </div>

            <div class="task-actions">
                <button class="button button-small edit-button" type="button">
                    Изменить
                </button>

                <button class="button button-small button-danger delete-button" type="button">
                    Удалить
                </button>
            </div>
        </article>
    </template>
</body>

</html>
