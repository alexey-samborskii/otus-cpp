name: C++ CI

on:
  push:
    branches:
      - master
      - feature/github_actions
      - feature/ip_filter
      - feature/allocatoor
      - feature/sfinae
      - feature/editor
      - feature/matrix
      - feature/bulk
      - feature/async_command_processor
      - feature/async-bulk-server
      - feature/join_server
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            doxygen \
            graphviz \
            libboost-system-dev

      - name: Configure CMake with tests
        run: |
          cmake -S . -B build \
            -DPATCH_VERSION=${{ github.run_number }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Build with tests
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Configure CMake for package
        run: |
          cmake -S . -B build-package \
            -DPATCH_VERSION=${{ github.run_number }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF

      - name: Build package
        run: cmake --build build-package --target package

      - name: Check package does not contain googletest
        run: |
          if dpkg-deb -c build-package/*.deb | grep -E "gtest|gmock"; then
            echo "ERROR: package contains googletest/gmock files"
            exit 1
          fi

      - name: Generate Doxygen documentation
        run: doxygen Doxyfile

      - name: Upload Doxygen documentation
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: html

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          draft: false
          prerelease: false

      - name: Find deb package
        id: find_deb
        run: |
          DEB_FILE=$(find build-package -name '*.deb' | head -n 1)
          echo "DEB_FILE=${DEB_FILE}" >> $GITHUB_OUTPUT
          echo "DEB_NAME=$(basename "${DEB_FILE}")" >> $GITHUB_OUTPUT

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.find_deb.outputs.DEB_FILE }}
          asset_name: ${{ steps.find_deb.outputs.DEB_NAME }}
          asset_content_type: application/vnd.debian.binary-package
